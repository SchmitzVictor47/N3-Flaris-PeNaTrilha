name: pe-na-trilha-pipeline

services:
  mongodb:
    image: mongo:7.0
    command: ["--wiredTigerCacheSizeGB", "1"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_dados:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongodb:
        condition: service_healthy

  airflow:
    build: .
    image: pe-na-trilha-airflow:1.0
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
      - "4040:4040"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "utc"
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: "America/Sao_Paulo"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "20"
      # O Spark ocupa todos os núcleos durante a DAG: a interface web não pode cair por timeout
      AIRFLOW__WEBSERVER__WORKERS: "2"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "600"
      AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: "0"
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-penatrilha}
      KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
      KAGGLE_KEY: ${KAGGLE_KEY:-}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-3g}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./penatrilha_pipeline:/opt/airflow/penatrilha_pipeline
      - ./tests:/opt/airflow/tests
      - ./relatorios:/opt/airflow/relatorios
      - ./entrada:/opt/airflow/dados/entrada
      - data_lake:/opt/airflow/dados
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  mongo_dados:
  data_lake:
